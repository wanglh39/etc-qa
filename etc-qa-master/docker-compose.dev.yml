version: "3"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${ETC_QA_MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: etc_qa
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  etc-qa:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ETC_QA_ENV: dev
      ETC_QA_MYSQL_HOST: mysql
      ETC_QA_MYSQL_PASSWORD: ${ETC_QA_MYSQL_PASSWORD:-123456}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-etc-qa}
      MODEL_BASE_DIR: /app/models
    volumes:
      - milvus_dev_data:/app/data/milvus
      - ./models/hub:/app/models/hub:ro
      - ./data:/app/data:ro
    command: >
      sh -c "python scripts/data/init_db.py dev &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  mysql_dev_data:
  milvus_dev_data: