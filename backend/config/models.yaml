# Embedding & Reranker 模型配置（SiliconFlow API）
models:
  embed:
    name: "BAAI/bge-large-zh-v1.5"
    dim: 1024
    api_base: "${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}"
    api_keys: "${SILICONFLOW_API_KEYS}"
  rerank:
    name: "BAAI/bge-reranker-v2-m3"
    api_base: "${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}"
    api_keys: "${SILICONFLOW_API_KEYS}"
  query_prefix: "为这个句子生成表示以用于检索相关文章："

# LLM模型能力注册表
# structured_method: json_schema / function_calling / none
# 优先级：agent.yaml llm.structured_method 显式指定 > 本注册表 > 代码兜底(none)
llm_registry:
  deepseek-chat:
    provider: deepseek
    structured_method: function_calling
    max_tokens_limit: 8192
  deepseek-reasoner:
    provider: deepseek
    structured_method: none
    max_tokens_limit: 8192
  deepseek-v4-flash:
    provider: deepseek
    structured_method: none
    max_tokens_limit: 8192
  deepseek-v4-pro:
    provider: deepseek
    structured_method: none
    max_tokens_limit: 8192
  gpt-4o:
    provider: openai
    structured_method: json_schema
    max_tokens_limit: 16384
  gpt-4o-mini:
    provider: openai
    structured_method: json_schema
    max_tokens_limit: 16384
  gpt-4-turbo:
    provider: openai
    structured_method: json_schema
    max_tokens_limit: 128000
  gpt-3.5-turbo:
    provider: openai
    structured_method: function_calling
    max_tokens_limit: 16384
  qwen-plus:
    provider: aliyun
    structured_method: function_calling
    max_tokens_limit: 8192
  qwen-turbo:
    provider: aliyun
    structured_method: function_calling
    max_tokens_limit: 8192
  glm-4-flash:
    provider: zhipu
    structured_method: none
    max_tokens_limit: 8192
  glm-4-plus:
    provider: zhipu
    structured_method: function_calling
    max_tokens_limit: 8192
