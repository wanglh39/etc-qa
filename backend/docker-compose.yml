version: "3"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${ETC_QA_MYSQL_PASSWORD:?required}
      MYSQL_DATABASE: etc_qa
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=100
      - --performance-schema=OFF
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  etc-qa:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ETC_QA_ENV: prod
      ETC_QA_MYSQL_PASSWORD: ${ETC_QA_MYSQL_PASSWORD:?required}
      ETC_QA_JWT_SECRET: ${ETC_QA_JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SILICONFLOW_API_KEYS: ${SILICONFLOW_API_KEYS:?required}
      ALICLOUD_ASR_APP_KEY: ${ALICLOUD_ASR_APP_KEY:?required}
      ALICLOUD_ASR_ACCESS_KEY_ID: ${ALICLOUD_ASR_ACCESS_KEY_ID:?required}
      ALICLOUD_ASR_ACCESS_KEY_SECRET: ${ALICLOUD_ASR_ACCESS_KEY_SECRET:?required}
      ALICLOUD_ASR_HOTWORDS_ID: ${ALICLOUD_ASR_HOTWORDS_ID}
    env_file:
      - .env
    volumes:
      - milvus_data:/app/data/milvus
    command: >
      sh -c "python scripts/data/init_db.py prod --skip-milvus &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ../frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - etc-qa
    volumes:
      - ../frontend/certs:/etc/nginx/certs:ro

volumes:
  mysql_data:
  milvus_data: