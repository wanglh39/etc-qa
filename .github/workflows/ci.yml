name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  ETC_QA_ENV: test

jobs:
  # ==================== Backend ====================
  backend-lint:
    name: Backend · Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff mypy
      - run: ruff check . --config pyproject.toml
      - run: ruff format --check . --config pyproject.toml

  backend-test:
    name: Backend · Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          pytest tests/ \
            --ignore=tests/integration \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --cov-config=.coveragerc \
            --cov-fail-under=80

  backend-integration:
    name: Backend · Integration Tests
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: etc_qa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          mysql -h 127.0.0.1 -u root -p123456 etc_qa_test < data/init_test_db.sql || true
      - run: |
          pytest tests/integration/ \
            -m integration \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            --cov-config=.coveragerc \
            --cov-fail-under=80

  backend-security:
    name: Backend · Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install bandit safety
      - run: bandit -r . -c pyproject.toml -f json -o bandit-report.json || true
      - run: safety check -r requirements.txt --json || true

  # ==================== Frontend ====================
  frontend-lint:
    name: Frontend · Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  frontend-typecheck:
    name: Frontend · Type Check
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit

  frontend-test:
    name: Frontend · Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-typecheck
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  frontend-e2e:
    name: Frontend · E2E Tests
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  backend-benchmark:
    name: Backend · Benchmark
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          pytest tests/benchmark/ \
            --benchmark-only \
            -q \
            -o addopts=""