name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  ETC_QA_ENV: test

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff mypy
      - run: ruff check . --config pyproject.toml
      - run: ruff format --check . --config pyproject.toml

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          pytest tests/ \
            --ignore=tests/integration \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --cov-config=.coveragerc \
            --cov-fail-under=80

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: etc_qa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          mysql -h 127.0.0.1 -u root -p123456 etc_qa_test < data/init_test_db.sql || true
      - run: |
          pytest tests/integration/ \
            -m integration \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            --cov-config=.coveragerc \
            --cov-fail-under=80

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install bandit safety
      - run: bandit -r . -c pyproject.toml -f json -o bandit-report.json || true
      - run: safety check -r requirements.txt --json || true