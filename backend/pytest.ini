[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=. --cov-report=term-missing --cov-report=html:htmlcov --cov-config=.coveragerc --cov-fail-under=80
markers =
    integration: 集成测试，需要真实MySQL/Milvus/模型，用 -m integration 运行
    slow: 慢速测试，需要模型加载
